[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gold-daily-brief"
version = "0.1.0"
description = "Fetch daily spot gold, convert USD/oz to CNY/g, and format a short daily briefing."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Bao Yanfei"}]
keywords = ["gold", "price", "briefing", "cny"]

[project.scripts]
gold-daily-brief = "gold_daily_brief.cli:main"

[tool.setuptools.packages.find]
include = ["gold_daily_brief*"]
